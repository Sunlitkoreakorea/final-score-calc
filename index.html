<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기말 점수 계산기</title>
  <meta name="description" content="원점수 80을 넘기려면 기말고사에서 몇 점이 필요한지 계산">
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='13' width='26' height='6' rx='3' fill='%23D9D6CF'/%3E%3Crect x='3' y='13' width='17' height='6' rx='3' fill='%23C2643A'/%3E%3Cpath d='M24 8v16' stroke='%232F3437' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="top">
        <h1>기말 점수 계산기</h1>
        <span class="term" id="term"></span>
      </header>

      <form class="find" id="find" role="search" autocomplete="off">
        <input id="q" type="search" placeholder="수업 검색" aria-label="수업 검색" enterkeyhint="search">
        <button type="button" id="qClear" hidden>취소</button>
      </form>

      <ul class="list" id="results" hidden></ul>

      <div id="mineWrap">
        <div class="label" id="mineLabel" hidden>내 수업</div>
        <ul class="list" id="mine"></ul>
        <p class="empty" id="empty" hidden>검색해서 내 수업을 추가하세요</p>
      </div>
    </aside>

    <main class="detail" id="detail" aria-live="polite"></main>
  </div>

  <script src="data.js?v=1"></script>
  <script src="core.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
